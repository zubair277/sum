services:
  - type: web
    name: summarizeai-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev --workspace backend
    startCommand: npm run start --workspace backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: FRONTEND_URL
        sync: false
      - key: TRUST_PROXY
        value: "1"
